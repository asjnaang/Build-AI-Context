name: ide-hosts

on:
  push:
    paths:
      - "ide/**"
      - "src/build_ai_context/constants.py"
      - "tests/test_policy_lock.py"
      - ".github/workflows/ide-hosts.yml"
  pull_request:

jobs:
  policy-and-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package and policy test dependency
        run: python -m pip install -e '.[dev]'
      - name: Policy lock
        run: PYTHONPATH=src python -m pytest tests/test_policy_lock.py -q
      - name: TypeScript engine
        working-directory: ide/engine-ts
        run: npm ci && npm test
      - name: VS Code compile and tests
        working-directory: ide/vscode
        run: npm ci && npm test
      - name: Package VSIX (artifact only; do not publish)
        working-directory: ide/vscode
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: ide/vscode/*.vsix

  intellij-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Kotlin engine tests
        working-directory: ide/intellij
        run: ./gradlew :engine:test --no-daemon
      - name: Package plugin zip (artifact only; do not publish)
        working-directory: ide/intellij
        run: ./gradlew :plugin:buildPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin-zip
          path: ide/intellij/plugin/build/distributions/plugin-0.1.0.zip
